# Configuration Center (Bab 68 Backlog Prioritas 7) — cost budgets, alert
# thresholds, telemetry backends/caps (Bab 27, 33-35, 56). NO SECRETS
# HERE. See api/config.py for the authoritative field list.

# Cost Optimization (Bab 27 rule 4): budget that, once exceeded, escalates
# to Human Approval (Bab 61.2) rather than completing silently.
COST_BUDGET_PER_TASK: 5.0
# Daily budget (Bab 27, 56): exceeding it surfaces as an alert (Bab 35
# rule 2), not an automatic block.
COST_BUDGET_DAILY: 50.0

# Alert thresholds (Bab 35 rule 2).
ALERT_ERROR_RATE_THRESHOLD: 0.2
ALERT_LATENCY_P95_MS: 30000

# Telemetry backends/caps (Bab 33-35, 56).
TRACE_BACKEND: "memory"
COST_BACKEND: "memory"
TRACE_MAX_SPANS_PER_TRACE: 200
METRICS_MAX_SAMPLES: 2000
