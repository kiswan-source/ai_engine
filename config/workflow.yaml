APPROVAL_STATE_BACKEND: "memory"

# Automation / Scheduler (Bab 68 Prioritas 5).
ENABLE_SCHEDULER: true
SCHEDULER_TICK_SECONDS: 30

# MCP — Model Context Protocol (Bab 60, Bab 57.1 standard flag).
ENABLE_MCP: true
MCP_SERVER_ROLE: "user"
MCP_SERVER_WORKSPACE_ID: null
MCP_SERVER_WORKSPACE_ROLE: "viewer"
