# PostgreSQL + PostGIS + pgvector (docker/Dockerfile.postgres, Tahap 5 —
# postgis/postgis:16-3.4-alpine plus the pgvector extension, whose files had
# to be copied into the base image's actual /usr/local server paths; see
# ADR-0008). StatefulSet (not Deployment) for stable network identity + a
# per-pod PVC — single replica here, matching docker-compose; real
# multi-replica Postgres HA needs a dedicated operator (Patroni, CloudNativePG),
# out of scope for this manifest set (see k8s/README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-engine
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: ai-engine-postgres:latest  # built from docker/Dockerfile.postgres; replaced by kustomize images:
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-engine-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: ai-engine-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-engine
spec:
  clusterIP: None  # headless — StatefulSet gives postgres-0.postgres a stable DNS name
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
