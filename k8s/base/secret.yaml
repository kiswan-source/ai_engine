# TEMPLATE ONLY — placeholder values, safe to commit (Bab 45.2 rule 4: never
# commit real secrets). Do not `kubectl apply -f` this file with the
# placeholders left in place for anything but local experimentation.
#
# Real values belong in one of (Bab 58.1's tiers, in increasing maturity):
#   - `kubectl create secret generic ai-engine-secrets --from-env-file=.env
#      --namespace ai-engine --dry-run=client -o yaml | kubectl apply -f -`
#     (keeps real values out of any file in this repo entirely)
#   - a GitOps secret-sealing tool (Sealed Secrets, SOPS) if manifests are
#     applied via a pipeline
#   - Vault + an External Secrets Operator once at that scale (Bab 58.1's
#     top tier) — `api/config.py` doesn't change either way (Bab 58.3).
apiVersion: v1
kind: Secret
metadata:
  name: ai-engine-secrets
  namespace: ai-engine
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  DATABASE_URL: "postgresql+asyncpg://aiuser:CHANGE_ME_PASSWORD@postgres:5432/ai_engine"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_DB: "ai_engine"
  POSTGRES_USER: "aiuser"
  POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD"
  # Leave any of these three blank to keep that provider disabled — the
  # Model Registry (Bab 20) falls back to local Ollama automatically.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  # Comma-separated `key` or `key:role` pairs (security/auth.py). Blank
  # disables API-key auth entirely — matches every route being open today
  # (Bab 45, no route currently opts into this dependency).
  API_KEYS: ""
