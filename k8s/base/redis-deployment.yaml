# Redis — single instance with persistence (matches docker-compose's
# `--save 60 1`), not a cluster. Bab 65's own DR table already treats
# working-memory loss as acceptable ("volatile by design"), but
# TASK_STATE_BACKEND/APPROVAL_STATE_BACKEND/COST_BACKEND/TRACE_BACKEND all
# depend on this Redis surviving restarts, hence the PVC. Real HA (Sentinel/
# Cluster) is out of scope here — single point of failure until that's added
# (see k8s/README.md gaps).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-engine
spec:
  replicas: 1
  strategy:
    type: Recreate  # a rolling update would briefly run two pods against one RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: ai-engine
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-engine
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
